# Port - matches old Typescript BFF default
quarkus.http.port=9001

# OUL backend URL (replaces olf BE_OUL_URL in .env)
quarkus.rest-client.oul.url=${BE_OUL_URL:http://localhost:8889}

# CORS - allow the frontend to call this BFF
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

portal.mock.handlaggare=true
portal.mock.handlaggare.id2.varde=${PORTAL_MOCK_HANDLAGGARE_ID2_VARDE}
portal.mock.handlaggare.id3.varde=${PORTAL_MOCK_HANDLAGGARE_ID3_VARDE}

# Container image
quarkus.container-image.build=true
quarkus.container-image.name=rimfrost-portal-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false